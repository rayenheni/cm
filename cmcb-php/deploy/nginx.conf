# Nginx + PHP-FPM. Adapter server_name, certificats et socket PHP-FPM.
server {
    listen 80;
    server_name cmcb.example.tn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cmcb.example.tn;
    root /var/www/cmcb-php/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/cmcb.example.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cmcb.example.tn/privkey.pem;
    # Encoded image uploads are limited again by the application.
    client_max_body_size 3m;

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Seul le contrôleur frontal est exécutable.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # Temporaire : retirer ce bloc après l'installation initiale.
    location = /install.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/install.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location = /router.php { return 404; }

    access_log /var/log/nginx/cmcb-access.log;
    error_log /var/log/nginx/cmcb-error.log;
}
