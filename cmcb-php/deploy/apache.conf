# Apache 2.4 + PHP-FPM. Adapter ServerName, chemins TLS et socket PHP-FPM.
# Modules : a2enmod rewrite proxy_fcgi setenvif ssl headers http2

<VirtualHost *:80>
    ServerName cmcb.example.tn
    Redirect permanent / https://cmcb.example.tn/
</VirtualHost>

<VirtualHost *:443>
    ServerName cmcb.example.tn
    Protocols h2 http/1.1
    DocumentRoot /var/www/cmcb-php/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/cmcb.example.tn/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cmcb.example.tn/privkey.pem

    <Directory /var/www/cmcb-php/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Seuls le contrôleur frontal et, temporairement, l'installateur sont exécutables.
    <FilesMatch "^(index|install)\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>
    <FilesMatch "(?i)^(?!index\.php$|install\.php$).*\.php$">
        Require all denied
    </FilesMatch>

    # Le routeur du serveur intégré PHP ne doit jamais être exposé.
    <Files "router.php">
        Require all denied
    </Files>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/cmcb-error.log
    CustomLog ${APACHE_LOG_DIR}/cmcb-access.log combined
</VirtualHost>
