; Pool dédié CMCB. Adapter user/group, socket et chemins si nécessaire.
[cmcb]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

clear_env = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.3-fpm-cmcb.log
php_admin_value[upload_max_filesize] = 1M
; JSON image uploads are validated by the application at 2 MiB decoded.
php_admin_value[post_max_size] = 3M
php_admin_value[max_execution_time] = 60
php_admin_value[memory_limit] = 128M
; Optionnel après validation des chemins :
; php_admin_value[open_basedir] = /var/www/cmcb-php:/tmp
