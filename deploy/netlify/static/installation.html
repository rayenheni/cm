<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Installation CMCB</title><link rel="stylesheet" href="/installation.css"><script src="/installation.js" defer></script></head>
<body><main><h1>Installation CMCB</h1><p>Cette installation est réservée au propriétaire et crée le premier compte administrateur ainsi que les articles initiaux. Utilisez une base vide et dédiée. Elle se ferme après la première installation.</p><form id="setup" autocomplete="off"><label>Clé secrète d'installation<input name="key" type="password" pattern="[a-f0-9]{64}" required autocomplete="off"></label><label>E-mail administrateur<input name="email" type="email" maxlength="254" required autocomplete="username"></label><label>Mot de passe administrateur (12 à 128 caractères)<input name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><label>Confirmez le mot de passe<input name="confirm" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><button type="submit">Installer</button></form><p role="status" id="result"></p></main></body></html>
