<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Installation CMCB</title><link rel="stylesheet" href="/installation.css"><script src="/installation.js" defer></script></head>
<body><main>
  <div class="languages" role="group" aria-label="Langue"><button type="button" data-lang="fr" aria-pressed="true">FR</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
  <h1 data-text="title">Installation CMCB</h1><p data-text="description">Cette installation est réservée au propriétaire et crée le premier compte administrateur ainsi que les articles initiaux. Utilisez une base vide et dédiée. Elle se ferme après la première installation.</p>
  <form id="setup" autocomplete="off"><label><span data-text="key">Clé secrète d'installation</span><input name="key" type="password" pattern="[a-f0-9]{64}" required autocomplete="off"></label><label><span data-text="email">E-mail administrateur</span><input name="email" type="email" maxlength="254" required autocomplete="username"></label><label><span data-text="password">Mot de passe administrateur (12 à 128 caractères)</span><input name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><label><span data-text="confirm">Confirmez le mot de passe</span><input name="confirm" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><button type="submit" data-text="submit">Installer</button></form><p role="status" id="result"></p>
</main></body></html>
